name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Getting PR diff..."

          gh pr diff \
            "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            > pr.diff

          echo "Diff size:"
          wc -c pr.diff

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AI code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import subprocess

          API_KEY = os.environ["GEMINI_API_KEY"]
          PR_NUMBER = os.environ["PR_NUMBER"]
          REPOSITORY = os.environ["REPOSITORY"]

          MODEL = "gemini-3.6-flash"

          with open("pr.diff", "r", encoding="utf-8", errors="replace") as file:
              diff = file.read()

          if not diff.strip():
              print("No changes found in PR.")
              exit(0)

          # Prevent extremely large PRs from consuming excessive API quota.
          MAX_DIFF_SIZE = 100000

          if len(diff) > MAX_DIFF_SIZE:
              print(
                  f"Diff is {len(diff)} bytes. "
                  f"Limiting to {MAX_DIFF_SIZE} bytes."
              )
              diff = diff[:MAX_DIFF_SIZE]

          prompt = f"""
          You are a senior Go backend engineer and security reviewer.

          Review this Pull Request for a Go Authentication Service
          belonging to a Hotel Management System.

          Your job is to identify real and actionable problems.

          DO NOT:
          - Complain about formatting handled by gofmt.
          - Report subjective stylistic preferences.
          - Invent vulnerabilities.
          - Give unnecessary praise.
          - Report issues unrelated to the changed code.

          REVIEW FOR:

          GO CODE QUALITY
          - Incorrect error handling
          - Nil pointer risks
          - Goroutine leaks
          - Race conditions
          - Context misuse
          - Resource leaks
          - Incorrect concurrency
          - Unnecessary complexity

          AUTHENTICATION SECURITY
          - Authentication bypasses
          - Authorization bypasses
          - Privilege escalation
          - JWT validation
          - JWT expiration
          - JWT algorithm validation
          - Token handling
          - Token replay
          - Password handling
          - Sensitive information exposure

          API SECURITY
          - Missing authentication middleware
          - Missing authorization checks
          - IDOR vulnerabilities
          - Missing input validation
          - SQL injection
          - Sensitive data in API responses
          - Sensitive data in logs
          - Incorrect HTTP status codes

          DATABASE
          - SQL injection
          - Incorrect transactions
          - Connection/resource leaks
          - Incorrect queries
          - Obvious performance issues

          TESTING
          - Missing tests for important functionality
          - Missing authentication failure tests
          - Missing authorization tests
          - Missing security edge cases
          - Tests that do not validate the intended behavior

          SEVERITY:

          CRITICAL
          Serious security vulnerability, authentication bypass,
          remote code execution, or major data exposure.

          HIGH
          Significant security issue, authorization bypass,
          serious production bug, or data corruption.

          MEDIUM
          Real bug, reliability issue, important validation problem,
          or significant maintainability issue.

          LOW
          Minor but legitimate improvement.

          OUTPUT FORMAT:

          ## AI Code Review

          ### Summary

          Briefly summarize the review.

          ### Findings

          For every finding:

          #### [SEVERITY] Short title

          **File:** `path/to/file.go`

          **Problem:**
          Explain the problem.

          **Why it matters:**
          Explain the impact.

          **Recommendation:**
          Explain how to fix it.

          If there are no meaningful issues, write:

          No critical, high, medium, or low severity issues found.

          PR DIFF:

          ```diff
          {diff}
          ```
          """

          url =